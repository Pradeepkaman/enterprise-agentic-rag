services:
  - type: web
    name: enterprise-agentic-rag
    runtime: python
    buildCommand: pip install -r requirements.txt && python src/ingest.py
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHROMA_DB_PATH
        value: ./chroma_db
